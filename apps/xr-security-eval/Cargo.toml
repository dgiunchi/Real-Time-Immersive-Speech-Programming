[package]
name = "xr-security-eval"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "xr_security_eval"
path = "src/lib.rs"

[[bin]]
name = "xr-security-eval"
path = "src/main.rs"

[[bin]]
name = "xr-security-demo"
path = "src/bin/demo.rs"

[[bin]]
name = "xr-latency"
path = "src/bin/latency.rs"

[dependencies]
dcvr-csharp-policy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
